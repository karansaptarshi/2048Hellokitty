<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Hello Kitty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="title-area">
      <img src="assets/1.png" alt="" class="title-kitty-img">
      <h1 class="title-text"><span class="title-2048">2048</span> Hello Kitty</h1>
    </header>

    <div class="panels">
      <div class="panel">
        <span class="panel-label">Level</span>
        <span id="level">—</span>
      </div>
      <div class="panel">
        <span class="panel-label">Level Max</span>
        <span id="level-max">—</span>
      </div>
      <div class="panel panel-kitty">
        <span class="panel-label">Kitty</span>
        <div class="panel-kitty-value">
          <img id="kitty-img" src="" alt="" class="panel-kitty-img">
          <span id="kitty-placeholder" class="panel-kitty-placeholder">—</span>
        </div>
      </div>
      <div class="panel panel-kitty">
        <span class="panel-label">Kitty Max</span>
        <div class="panel-kitty-value">
          <img id="kitty-max-img" src="" alt="" class="panel-kitty-img">
          <span id="kitty-max-placeholder" class="panel-kitty-placeholder">—</span>
        </div>
      </div>
    </div>

    <div class="game-intro">
      <p>Join the Kitties!</p>
      <button id="new-game-btn">Play Again</button>
    </div>

    <div class="game-wrapper">
      <div id="grid-container"></div>
      <div id="game-over">
        <p>Game Over!</p>
        <button id="retry-btn">Try Again</button>
      </div>
      <div id="win-overlay">
        <p>You Win!</p>
        <button id="keep-playing-btn">Keep Playing</button>
      </div>
    </div>

    <section class="levels-legend">
      <h2 class="levels-title">
        <img src="assets/1.png" alt="" class="levels-kitty-img">
        Kitty Level
      </h2>
      <div class="levels-grid">
        <div class="level-item"><img src="assets/1.png" alt="1"><span>1</span></div>
        <div class="level-item"><img src="assets/2.png" alt="2"><span>2</span></div>
        <div class="level-item"><img src="assets/3.png" alt="3"><span>3</span></div>
        <div class="level-item"><img src="assets/4.png" alt="4"><span>4</span></div>
        <div class="level-item"><img src="assets/5.png" alt="5"><span>5</span></div>
        <div class="level-item"><img src="assets/6.png" alt="6"><span>6</span></div>
        <div class="level-item"><img src="assets/7.png" alt="7"><span>7</span></div>
        <div class="level-item"><img src="assets/8.png" alt="8"><span>8</span></div>
        <div class="level-item"><img src="assets/9.png" alt="9"><span>9</span></div>
        <div class="level-item"><img src="assets/10.png" alt="10"><span>10</span></div>
        <div class="level-item"><img src="assets/11.png" alt="11"><span>11</span></div>
      </div>
    </section>
  </div>

  <span id="score" hidden>0</span>
  <span id="best" hidden>0</span>
  <script src="app.js"></script>
</body>
</html>
